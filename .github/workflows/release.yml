name: IDEA 标签发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已推送的注解版本标签，例如 v0.0.2'
        type: string
        required: true
      tested_run_id:
        description: '同一源码提交通过 IDEA 开发检查的 main push run ID'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-idea-refs/tags/${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      tested_run_id: ${{ steps.version.outputs.tested_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 核对标签与 main 提交
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TESTED_RUN_ID: ${{ inputs.tested_run_id }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/check-release-archive.py --tag "$RELEASE_TAG" --version-only)"
          source_sha="$(git rev-parse HEAD)"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$source_sha"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$TESTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            # 仅能复用本仓 main 推送、同一提交、完整通过开发检查的产物。
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN_ID" |
              jq -e --arg repository "$GITHUB_REPOSITORY" --arg commit "$source_sha" '
                .repository.full_name == $repository and
                .head_repository.full_name == $repository and
                .head_sha == $commit and .head_branch == "main" and .event == "push" and
                .path == ".github/workflows/build.yml" and
                .status == "completed" and .conclusion == "success"
              ' > /dev/null
          fi
          printf 'version=%s\nrelease_tag=%s\nsource_sha=%s\ntested_run_id=%s\n' \
            "$version" "$RELEASE_TAG" "$source_sha" "$TESTED_RUN_ID" >> "$GITHUB_OUTPUT"
  verify:
    needs: tag
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml
  sign:
    needs: [tag, verify]
    if: >-
      !cancelled() && needs.tag.result == 'success' &&
      (needs.verify.result == 'success' ||
      (needs.verify.result == 'skipped' && needs.tag.outputs.tested_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARCHIVE_NAME: leximeet-idea-${{ needs.tag.outputs.version }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: idea-release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.tag.outputs.tested_run_id || github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: 准备签名工具
        run: |
          install -d -m 700 "$RUNNER_TEMP/signed"
          ./gradlew --no-daemon --no-configuration-cache prepareReleaseSigner
      - name: 签名并校验通过测试的 ZIP
        env:
          LEXIMEET_SIGNING_CERTIFICATE: ${{ secrets.LEXIMEET_SIGNING_CERTIFICATE }}
          LEXIMEET_SIGNING_PRIVATE_KEY: ${{ secrets.LEXIMEET_SIGNING_PRIVATE_KEY }}
          LEXIMEET_SIGNING_PASSWORD: ${{ secrets.LEXIMEET_SIGNING_PASSWORD }}
        run: bash scripts/sign-release.sh "$RUNNER_TEMP/candidate/$ARCHIVE_NAME" "$RUNNER_TEMP/signed/$ARCHIVE_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: idea-signed-release
          path: |
            ${{ runner.temp }}/signed/${{ env.ARCHIVE_NAME }}
            ${{ runner.temp }}/signed/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [tag, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: idea-signed-release
          path: ${{ runner.temp }}/signed
      - name: 创建 GitHub Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.tag.outputs.release_tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/signed"
          name="leximeet-idea-$VERSION.zip"
          sha256sum "$name" | cmp "$name.sha256" -
          if release="$(gh release view "$RELEASE_TAG" --json isDraft,assets --jq '[.isDraft, .assets[].name][]' 2>/dev/null)"; then
            # 重跑逐个比对已有附件，只补传草稿中缺少的附件。
            existing="$RUNNER_TEMP/existing-release"
            for asset in "$name" "$name.sha256"; do
              if grep -Fxq -- "$asset" <<< "$release"; then
                gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$existing"
                cmp "$asset" "$existing/$asset"
              elif [[ "${release%%$'\n'*}" != true ]]; then
                echo "已发布的 Release 缺少附件：$asset" >&2
                exit 1
              fi
            done
            for asset in "$name" "$name.sha256"; do
              if ! grep -Fxq -- "$asset" <<< "$release"; then
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "$name" "$name.sha256" \
              --verify-tag --draft --generate-notes --title "词遇 IDEA $VERSION" \
              --notes "运行需要带 IDEA 连接能力的词遇 Desktop。安装前可使用同名 SHA-256 文件校验 ZIP。"
          fi
  marketplace:
    if: >-
      needs.tag.outputs.release_tag != 'v0.0.1' &&
      (vars.LEXIMEET_PUBLISH_MARKETPLACE == 'true' || vars.LEXIMEET_MARKETPLACE_TAG == needs.tag.outputs.release_tag)
    needs: [tag, draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: idea-signed-release
          path: ${{ runner.temp }}/signed
      - name: 上传已签名的 Stable 产物
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ needs.tag.outputs.release_tag }}
        run: bash scripts/upload-marketplace.sh "$RELEASE_TAG" "$RUNNER_TEMP/signed"
