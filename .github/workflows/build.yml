name: IDEA 开发检查
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: idea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # 与 Desktop 自身的真实浏览器联调采用同一类有图形会话的 runner。
    runs-on: macos-15
    timeout-minutes: 45
    env:
      LEXIMEET_DESKTOP_ROOT: ${{ github.workspace }}/.ci/desktop
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.14.0'
      - name: 准备可启动的 IntelliJ IDEA 2026.1.5
        run: |
          # Gradle 提取的 2025.2 macOS 发行目录可编译却无法作为原生应用进程启动。
          # 有本机安装即复用；无安装的 CI 才挂载校验后的官方 Apple Silicon 镜像。
          if [[ -r '/Applications/IntelliJ IDEA.app/Contents/Resources/product-info.json' &&
                -x '/Applications/IntelliJ IDEA.app/Contents/MacOS/idea' ]]; then
            exit 0
          fi
          test "$(uname -m)" = arm64
          image="$RUNNER_TEMP/idea-2026.1.5-aarch64.dmg"
          mount="$RUNNER_TEMP/leximeet-idea-mount"
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 3 --max-time 480 -o "$image" \
            https://download.jetbrains.com/idea/idea-2026.1.5-aarch64.dmg
          printf '8d9c3d9260cb1343549983e00b373d818821c343cbc23d1fb55b2152021fc48d  %s\n' "$image" | shasum -a 256 -c -
          hdiutil attach "$image" -nobrowse -readonly -mountpoint "$mount"
          test -x "$mount/IntelliJ IDEA.app/Contents/MacOS/idea"
          echo "LEXIMEET_IDE_APP=$mount/IntelliJ IDEA.app" >> "$GITHUB_ENV"
          echo "LEXIMEET_CI_IDEA_MOUNT=$mount" >> "$GITHUB_ENV"
      - name: 配置独立的 UI 验收输出
        run: echo "LEXIMEET_IDEA_TEST_OUTPUT=$RUNNER_TEMP/leximeet-idea-ui" >> "$GITHUB_ENV"
      - name: 格式、单元、Socket 集成测试与构建
        id: candidate
        run: |
          umask 077
          ./gradlew --no-daemon spotlessCheck test buildPlugin uiTestJar
          python3 scripts/test-check-release-archive.py
          python3 scripts/check-release-archive.py
          version="$(python3 scripts/check-release-archive.py --version-only)"
          echo "archive=build/distributions/leximeet-idea-$version.zip" >> "$GITHUB_OUTPUT"
      - name: IntelliJ IDEA 原生 UI 自动化
        run: node scripts/verify-connected.cjs --ui-only
      - name: 获取与本插件匹配的 Desktop 和 Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leximeet/leximeet-desktop
          ref: a9a963c51edbdebc4fcdb3cb9c91a810cc8adda2
          path: .ci/desktop
          submodules: recursive
          persist-credentials: false
      - name: 构建真实的 Electron Desktop 与 Java Core
        working-directory: .ci/desktop
        run: |
          umask 077
          test "$(git -C core-java rev-parse HEAD)" = 36f13f947021301c8fe6889a9245c15a7281a294
          git log -1 --format='Desktop %H'
          git -C core-java log -1 --format='Core %H'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run install:electron
          npm run build
      - name: IDEA 与 Desktop 端到端联调
        run: node scripts/verify-connected.cjs --full-decompiler
      - name: 释放本次 CI 挂载的 IDEA 镜像
        if: always() && env.LEXIMEET_CI_IDEA_MOUNT != ''
        run: hdiutil detach "$LEXIMEET_CI_IDEA_MOUNT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: idea-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/leximeet/idea-home.txt
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/steps.txt
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/failure.txt
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/*.png
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/idea-process.log
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/ide-log/idea.log
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/background-focus.json
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/desktop-background.jsonl
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: idea-release-candidate
          path: ${{ steps.candidate.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
