name: IDEA 开发检查
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: idea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Swing 和 Electron 共用独立的虚拟显示，无需系统前台会话。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEXIMEET_DESKTOP_ROOT: ${{ github.workspace }}/.ci/desktop
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.14.0'
      - name: 准备 IntelliJ IDEA Community 2025.2.6.4
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth
          fi
          # 复用已安装的同一版本，确保构建和图形验收覆盖最低兼容分支。
          check_idea() {
            [[ -x "$1/bin/idea" && -x "$1/jbr/bin/java" && -r "$1/product-info.json" ]] &&
              python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["productCode"] == "IC" and p["version"] == "2025.2.6.4"' \
                "$1/product-info.json"
          }
          for home in /opt/idea /opt/intellij-idea /usr/local/idea /snap/intellij-idea-community/current; do
            if check_idea "$home"; then
              echo "LEXIMEET_IDE_APP=$home" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          test "$(uname -m)" = x86_64
          archive="$RUNNER_TEMP/ideaIC-2025.2.6.4.tar.gz"
          home="$RUNNER_TEMP/idea-community"
          curl --fail --silent --show-error --location --proto '=https' \
            --retry 3 --max-time 480 -o "$archive" \
            https://download.jetbrains.com/idea/ideaIC-2025.2.6.4.tar.gz
          printf '3662d856e07436a51fd2b6c502d42e3a4b9379175f3e67e9d64920434baedc5d  %s\n' "$archive" | sha256sum --check
          install -d "$home"
          tar -xzf "$archive" --strip-components=1 -C "$home"
          check_idea "$home"
          echo "LEXIMEET_IDE_APP=$home" >> "$GITHUB_ENV"
      - name: 配置独立的 UI 验收输出
        run: echo "LEXIMEET_IDEA_TEST_OUTPUT=$RUNNER_TEMP/leximeet-idea-ui" >> "$GITHUB_ENV"
      - name: 格式、单元、Socket 集成测试与构建
        id: candidate
        run: |
          umask 077
          ./gradlew --no-daemon spotlessCheck test buildPlugin uiTestJar
          python3 scripts/test-check-release-archive.py
          python3 scripts/check-release-archive.py
          version="$(python3 scripts/check-release-archive.py --version-only)"
          echo "archive=build/distributions/leximeet-idea-$version.zip" >> "$GITHUB_OUTPUT"
      - name: IntelliJ IDEA 原生 UI 自动化
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/verify-connected.cjs --ui-only
      - name: 获取与本插件匹配的 Desktop 和 Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leximeet/leximeet-desktop
          ref: ce3b042ec7ccbed124cda53cb1addf7eef8ed342
          path: .ci/desktop
          submodules: recursive
          persist-credentials: false
      - name: 构建真实的 Electron Desktop 与 Java Core
        working-directory: .ci/desktop
        run: |
          umask 077
          test "$(git -C core-java rev-parse HEAD)" = 36f13f947021301c8fe6889a9245c15a7281a294
          git log -1 --format='Desktop %H'
          git -C core-java log -1 --format='Core %H'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run install:electron
          npm run build
      - name: IDEA 与 Desktop 端到端联调
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/verify-connected.cjs --full-decompiler
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: idea-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/leximeet/idea-home.txt
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/steps.txt
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/failure.txt
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/*.png
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/idea-process.log
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/idea-threads.txt
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/ide-log/idea.log
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/background-focus.json
            ${{ env.LEXIMEET_IDEA_TEST_OUTPUT }}/*/desktop-background.jsonl
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: idea-release-candidate
          path: ${{ steps.candidate.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
